
<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Voz Acessível</title>

    <link rel="stylesheet" href="style.css">
</head>

<body>

<header>
    <h1>🔊 Voz Acessível</h1>
    <p>Transformando textos em voz para todos!</p>
</header>

<main class="container">

    <h2>Digite ou cole seu texto abaixo:</h2>

    <textarea
        id="texto"
        aria-label="Digite o texto que deseja ouvir"
        placeholder="Escreva aqui o texto que deseja transformar em áudio..."
    ></textarea>

    <h2>Controles de áudio</h2>

    <button class="ouvir" onclick="falar()">
        🔊 Ouvir texto
    </button>

    <button class="pausar" onclick="pausar()">
        ⏸ Pausar
    </button>

    <button class="continuar" onclick="continuar()">
        ▶ Continuar
    </button>

    <button class="parar" onclick="parar()">
        ⏹ Parar
    </button>

    <section class="configuracoes">

        <h2>Configurações de acessibilidade</h2>

        <label for="voz">Escolha a voz:</label>
        <select id="voz"></select>

        <label for="velocidade">
            Velocidade da fala:
        </label>

        <select id="velocidade">
            <option value="0.6">Muito devagar</option>
            <option value="0.8">Devagar</option>
            <option value="1" selected>Normal</option>
            <option value="1.2">Rápido</option>
            <option value="1.5">Muito rápido</option>
        </select>

        <label for="tamanho">
            Tamanho das letras:
        </label>

        <select id="tamanho" onchange="mudarTamanho()">
            <option value="21">Normal</option>
            <option value="26">Grande</option>
            <option value="32">Muito grande</option>
            <option value="40">Extra grande</option>
        </select>

        <button onclick="contraste()">
            🌓 Ativar alto contraste
        </button>

    </section>

    <p class="status" id="status" role="status" aria-live="polite">
        Aguardando texto...
    </p>

</main>

<footer>
    <p>Voz Acessível © 2026</p>
    <p>Tecnologia e inclusão para todos.</p>
</footer>

<script src="script.js"></script>

</body>
</html>
